# Privileged confinado: PSS enforce=privileged SOLO en este namespace.
# El nodo es alphalink (dedicado, taint dedicated=alpha): nunca privileged en un nodo compartido (SC-1212, requisito 07-11).
apiVersion: v1
kind: Namespace
metadata:
  name: redroid
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
