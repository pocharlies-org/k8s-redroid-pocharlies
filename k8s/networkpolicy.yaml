# adb (5555) solo desde la tailnet; scrcpy tunneliza por adb, no abre puerto propio.
# Sin default-deny: el resto del trafico sigue como estaba (egress del emulador a Internet lo necesita Instagram/GMS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adb-only-tailnet
  namespace: redroid
spec:
  podSelector:
    matchLabels:
      app: redroid
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - protocol: TCP
          port: 5555
