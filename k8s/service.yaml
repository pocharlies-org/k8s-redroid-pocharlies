# adb para la tailnet: scrcpy/adb desde cualquier máquina del tailnet contra
# 100.94.8.40:30555 (IP tailnet de alphalink). Nunca expuesto fuera del tailnet (NetworkPolicy).
# scrcpy: adb connect 100.94.8.40:30555 && scrcpy -s 100.94.8.40:30555
apiVersion: v1
kind: Service
metadata:
  name: redroid-adb
  namespace: redroid
spec:
  type: NodePort
  selector:
    app: redroid
  ports:
    - name: adb
      port: 5555
      targetPort: 5555
      nodePort: 30555
